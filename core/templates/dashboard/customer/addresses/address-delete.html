{% extends 'dashboard/customer/base.html' %}
{% load static %}
{% load humanize %}

{% block content %}
<div id="addresses">
  <div class="section-header" data-aos="fade-up">
    <h2>Delete Address</h2>
  </div>

  <div class="settings-content">
    <div class="settings-section" data-aos="fade-up" data-aos-delay="200">

      <form method="post" class="settings-form">
        {% csrf_token %}

        <!-- Centered warning box -->
        <div class="form-group" style="text-align:center; margin: 0 auto; max-width: 720px;">
          <div style="
              padding: 18px 16px;
              border-radius: 10px;
              border: 1px solid rgba(253, 0, 25, 0.25);
              background: rgba(255, 0, 25, 0.06);
            ">
            <div style="font-weight: 700; font-size: 18px; margin-bottom: 6px;">
              Are you sure you want to delete this address?
            </div>
            <div style="opacity: 0.85;">
              This action cannot be undone.
            </div>
          </div>
        </div>

        <div class="row mt-2" style="max-width: 720px; margin: 0 auto;">
          <div class="col-md-12 form-group">
            <label class="form-label">Street Address</label>
            <input type="text" class="form-control" value="{{ object.address }}" disabled>
          </div>

          <div class="col-md-4 form-group">
            <label class="form-label">City</label>
            <input type="text" class="form-control" value="{{ object.city }}" disabled>
          </div>

          <div class="col-md-4 form-group">
            <label class="form-label">State</label>
            <input type="text" class="form-control" value="{{ object.state }}" disabled>
          </div>

          <div class="col-md-4 form-group">
            <label class="form-label">ZIP Code</label>
            <input type="text" class="form-control" value="{{ object.zip_code }}" disabled>
          </div>
        </div>

        <div class="form-buttons mt-4" style="display:flex; gap:10px; justify-content:flex-end; max-width: 720px; margin: 10px auto 0;">
          <a href="{% url 'dashboard:customer:addresses-list' %}" class="btn-save pt-2">
            Cancel
          </a>

          <button type="submit" class="btn-save" style="background:#dc3545;">
            Delete Address
          </button>
        </div>

      </form>

    </div>
  </div>
</div>
{% endblock %}
