{% extends 'dashboard/admin/base.html' %}
{% load static %}

{% block content %}
<div class="section-header" data-aos="fade-up">
  <h2>Delete Coupon</h2>
  <div class="row mb-4">
    <div class="col-12 mt-3">
      <a href="{% url 'dashboard:admin:coupon-list' %}" class="btn btn-add-new pt-2">
        <i class="bi bi-arrow-left"></i> Back to coupons
      </a>
    </div>
  </div>
</div>

<div class="card border-0 shadow-sm">
  <div class="card-body text-center py-5">
    <i class="bi bi-exclamation-triangle text-danger" style="font-size: 3rem;"></i>
    <h4 class="mt-3">Are you sure?</h4>
    <p class="text-muted">
      You are about to delete coupon <strong class="text-dark">{{ object.code }}</strong>
      ({{ object.discount_percent }}% discount).
      This action cannot be undone.
    </p>

    <form method="POST">
      {% csrf_token %}
      <div class="d-flex justify-content-center gap-2 mt-4">
        <a href="{% url 'dashboard:admin:coupon-list' %}" class="btn btn-outline-secondary">Cancel</a>
        <button type="submit" class="btn btn-danger">
          <i class="bi bi-trash"></i> Yes, Delete
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
