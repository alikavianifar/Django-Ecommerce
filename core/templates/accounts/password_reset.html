{% extends "base.html" %}
{% block content %}
<section id="login-register" class="login-register section">

  <div class="container" data-aos="fade-up" data-aos-delay="100">

    <div class="row justify-content-center">
      <div class="col-lg-5">
        <div class="login-register-wraper">
          <h4 class="text-center mb-4">Reset your password</h4>
          <p class="text-center">Enter your email address and we will send you a reset link.</p>
          <form method="post">
            {% csrf_token %}
            <div class="mb-4">
              <input type="email" name="email" class="form-control" placeholder="Your email address" required="">
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary btn-lg">Send reset link</button>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-4">
              <div class="form-check">
              </div>
              <a href="{% url 'accounts:login' %}" class="forgot-password">Back to login</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>

{% endblock %}
