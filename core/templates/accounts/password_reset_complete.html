{% extends "base.html" %}
{% block content %}

<section id="order-confirmation" class="order-confirmation section">
  <div class="container" data-aos="fade-up" data-aos-delay="100">
    <div class="order-confirmation-1">
      <div class="next-steps text-center p-4" data-aos="fade-up" data-aos-delay="250">
        <h3>Password reset complete</h3>
        <p>Your password has been set. You can now log in.</p>
        <div class="action-buttons">
          <a href="{% url 'accounts:login' %}" class="btn btn-primary me-3 mb-2 mb-md-0">
            Go to login
          </a>
        </div>
      </div>
    </div>
  </div>
</section>

{% endblock %}
