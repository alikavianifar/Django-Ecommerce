{% extends 'base.html' %}
{% load static %}

{% block content %}

<!-- Login Register Section -->
<section id="login-register" class="login-register section">

  <div class="container" data-aos="fade-up" data-aos-delay="100">

    <div class="row justify-content-center">
      <div class="col-lg-5">
        <div class="login-register-wraper">

          <!-- Tab Navigation -->
          <ul class="nav nav-tabs nav-tabs-bordered justify-content-center mb-4">
            <li class="nav-item">
              <a class="nav-link active" href="{% url 'accounts:login' %}">
                <i class="bi bi-box-arrow-in-right me-1"></i>Login
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="{% url 'accounts:register' %}">
                <i class="bi bi-person-plus me-1"></i>Register
              </a>
            </li>
          </ul>

          {% include 'messages.html' %}

          <form action="{% url 'accounts:login' %}" method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ request.GET.next }}">
            <div class="mb-4">
              <label for="login-register-login-email" class="form-label">Username</label>
              <input type="text" name="username" class="form-control" id="login-register-login-email" required="">
            </div>

            <div class="mb-4">
              <label for="login-register-login-password" class="form-label">Password</label>
              <input type="password" name="password" class="form-control" id="login-register-login-password"
                required="">
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
              <div class="form-check">
                <input type="checkbox" class="form-check-input" id="login-register-remember-me">
                <label class="form-check-label" for="login-register-remember-me">Remember me</label>
              </div>
              <a href="{% url 'accounts:password-reset' %}" class="forgot-password">Forgot Password?</a>
            </div>

            <div class="d-grid">
              <button type="submit" class="btn btn-primary btn-lg">Login</button>
            </div>

          </form>

        </div>
      </div>
    </div>

  </div>

</section><!-- /Login Register Section -->

{% endblock %}
