<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="font-family: sans-serif; color: #333; max-width: 520px; margin: 0 auto;">
  <h2>Verify your email address</h2>
  <p>Hello {{ user.email }},</p>
  <p>Click the button below to verify your email. This link expires in {{ expiry_hours }} hours.</p>
  <p style="text-align:center; margin: 32px 0;">
    <a href="{{ verify_url }}"
       style="background:#4f46e5;color:#fff;padding:12px 28px;border-radius:6px;text-decoration:none;font-weight:bold;">
      Verify Email
    </a>
  </p>
  <p style="font-size:12px;color:#888;">
    If you did not create an account, ignore this email.
  </p>
</body>
</html>
