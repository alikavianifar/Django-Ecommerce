<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="font-family: sans-serif; color: #333; max-width: 520px; margin: 0 auto;">
  <h2>Reset your password</h2>
  <p>Hello,</p>
  <p>We received a request to reset the password for your account ({{ email }}).</p>
  <p style="text-align:center; margin: 32px 0;">
    <a href="{{ protocol }}://{{ domain }}{% url 'accounts:password-reset-confirm' uidb64=uid token=token %}"
       style="background:#4f46e5;color:#fff;padding:12px 28px;border-radius:6px;text-decoration:none;font-weight:bold;">
      Reset Password
    </a>
  </p>
  <p>This link expires in <strong>3 days</strong>.</p>
  <p style="font-size:12px;color:#888;">
    If you did not request a password reset, ignore this email. Your password will not change.
  </p>
</body>
</html>
